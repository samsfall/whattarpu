name: Avisos del Senamhi (cada 3 horas)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: write

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/descargar-avisos-senamhi.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/avisos.json
          git diff --cached --quiet || git commit -m "Actualiza avisos del Senamhi"
          git push
