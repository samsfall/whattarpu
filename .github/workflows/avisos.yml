name: Avisos del Senamhi (manual)

# Apagado por ahora: el Senamhi no publica sus avisos en formato CAP (el Registro de Autoridades de Alerta
# de la OMM no tiene canal para Perú). Se deja solo el botón manual "Run workflow" para cuando exista.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/descargar-avisos-senamhi.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/avisos.json
          git diff --cached --quiet || git commit -m "Actualiza avisos del Senamhi"
          git push
