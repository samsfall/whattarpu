name: Generar historial de clima (NASA POWER)

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    paths: ['data/zonas.json']
  schedule:
    - cron: '17 6 1 8 *'    # cada 1 de agosto (inicio de campaña)

permissions:
  contents: write

jobs:
  historial:
    runs-on: ubuntu-latest
    env:
      EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
      EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.mjs
      - run: node scripts/generar-historial.mjs
      - name: Datos NASA con cuenta Earthdata (MODIS vía AppEEARS)
        if: ${{ env.EARTHDATA_USER != '' }}
        run: node scripts/descargar-nasa-earthdata.mjs
      - name: Guardar tablas en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/historial
          git diff --cached --quiet || git commit -m "Actualiza historial de clima (NASA POWER)"
          git push
